syntax = "proto3";

package shop;

service InventoryService {
  rpc CheckInventory (OrderRequest) returns (InventoryReply);
}

service OrderService {
  rpc PlaceOrder (OrderRequest) returns (OrderReply);
}

message OrderRequest {
  string item_id = 1;
  int32 quantity = 2;
}

message InventoryReply {
  bool available = 1;
  string item_id = 2;
  int32 quantity = 3;
}

message OrderReply {
  string status = 1;
  string item_id = 2;
  int32 quantity = 3;
}
